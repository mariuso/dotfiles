command_timeout=3000 #ms

format = """$username$directory$git_branch$cmd_duration\n$nodejs$golang$gcloud$kubernetes
$character"""

[username]
show_always = true
style_user = "bg:#83a598 fg:#282828"
style_root = "bg:#83a598 fg:#282828"
format = '[ $user ]($style)'

[directory]
truncation_length = 5
style = "bg:#b8bb26 fg:#282828"
format = "[ $path ]($style)"

[git_branch]
style = "bg:#fabd2f fg:#282828"
format = "[ $symbol$branch ]($style)"
symbol = " "

[cmd_duration]
min_time = 500
style = "bg:#d3869b fg:#282828"
format = "[ took $duration ]($style)"

[gcloud]
symbol = "☁️ "
style = "bg:#fb4934 fg:#282828"
format = '[ $symbol$account/$project ]($style)'

# GCLOUD_PROJECT_ALIASES_PLACEHOLDER

[kubernetes]
style = "bg:#fe8019 fg:#282828"
format = '[ $symbol$context( \($namespace\)) ]($style)'

[golang]
symbol = " "
style = "bg:#83a598 fg:#282828"
format = "[ $symbol($version) ]($style)"

[nodejs]
symbol = " "
style = "bg:#8ec07c fg:#282828"
format = "[ $symbol($version) ]($style)"

[python]
symbol = " "

[battery]
full_symbol = "🔋 "
charging_symbol = "🔌 "
discharging_symbol = "⚡ "

[[battery.display]]
threshold = 20
style = 'bold red'

[character]
format = "❯❯ "
success_symbol = "[❯❯](bold green) "
error_symbol = "[❯❯](bold red) "
